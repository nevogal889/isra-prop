   1. FORMATTERS
   ========================================================================= */
const n0 = n => Math.round(n).toLocaleString('en-US');
const ils = n => n >= 1e6 ? `₪${(n / 1e6).toFixed(2)}M` : `₪${n0(n / 1000)}K`;
const ilsK = n => `₪${(n / 1000).toFixed(1)}K`;
const pct = (x, d = 0) => `${(x * 100).toFixed(d)}%`;
const signPct = (x, d = 1) => `${x >= 0 ? '+' : '−'}${Math.abs(x * 100).toFixed(d)}%`;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const Num = ({ children, className = '' }) => <span dir="ltr" className={`num ${className}`}>{children}</span>;

/* =========================================================================
   2. RULES LIBRARY  (from research, Nov 2026. Every rule carries source, confidence and legal strength)
   ========================================================================= */

const RULES = [
  // Layer 1: TA/5000 (read from the plan text)
  { id: 'gis-data', layer: 1, short: 'GIS עירוני', title: 'מקור נתוני החלקה', value: 'נשלף ב-05/11/2026 משרת ה-GIS של העירייה, לכל החלקות הבנויות בתחומי התכניות 3616א, 3729א, 4320 ו-4562. לכל חלקה: גוש וחלקה, שטח רשום ופוליגון (חזית לפי המלבן החוסם), מבנה (קומות, קומה מפולשת, שנת בנייה, תכסית), שימור, אזור ההכרזה (אזורים A–C; אזור החיץ אינו נחשב הכרזה), בקשות והיתרי בנייה, ותכניות בהכנה. הסטטוס נגזר מההיתרים: היתר תוספת, הריסה או תמ״א 38 מ-2018 ואילך, או בניין שנבנה מ-2008, נחשבים פרויקט פעיל. בקשה פתוחה מ-2020 ואילך נחשבת בקשה להיתר. ״מספר קומות״ בשכבה לא כולל את קומת הקרקע, וזו הסקה מגובה המבנים.', when: 'כל החלקות בסריקה', strength: 'vested', conf: 'medium', src: ['gis'] },
  { id: 't5000-permit', layer: 1, short: 'תא/5000 §2.5', title: 'אין היתר ישירות מתא/5000', value: 'תכנית מתאר כוללנית. היתרים מוצאים מכוח תכנית מפורטת (תכנית רובע או תא/מק).', when: 'תמיד', strength: 'vested', conf: 'high', src: ['p5000'] },
  { id: 't5000-far', layer: 1, short: 'תא/5000 · הגדרת רח״ק', title: 'הגדרת רח״ק', value: 'רצפה חלקי קרקע, מעל פני הקרקע בלבד: שטח עיקרי, שירות, ממ״ד וכל שטח מקורה. מרתפים לא נספרים. שטח המגרש נמדד נטו, אחרי הפרשות לציבור.', when: 'כל אזורי הייעוד', strength: 'vested', conf: 'high', src: ['p5000'] },
  { id: 't5000-urban', layer: 1, short: 'תא/5000 §3.2.4', title: 'אזור מגורים בבנייה עירונית', value: 'רח״ק בסיסי 2.5. מרבי: 2.5 במגרש עד 0.5 דונם, 3.0 ב-0.5–1.5 דונם, 4.0 מעל 1.5 דונם. צפיפות לפחות 18 יח״ד לדונם נטו. מספר הקומות נקבע בנספח העיצוב העירוני (מפה).', when: 'לפי תשריט אזורי הייעוד', strength: 'vested', conf: 'high', src: ['p5000'] },
  { id: 't5000-lot', layer: 1, short: 'תא/5000 · אזורים נוספים', title: 'שאר אזורי המגורים', value: 'בנייה נמוכה (§3.2.2): רח״ק 1, אין תוספת קומות ויח״ד מעבר לתכניות קודמות. עירונית נמוכה (§3.2.3): בסיסי 1, מרבי 3.0. רבת קומות (§3.2.5): בסיסי 2.5, מרבי 4.5 עד 2 דונם ו-5.0 מעל.', when: 'לפי תשריט', strength: 'vested', conf: 'high', src: ['p5000'] },
  { id: 't5000-313', layer: 1, short: 'תא/5000 §3.1.3', title: 'מעבר מהבסיסי למרבי', value: 'מותנה בהקצאה לציבור (§4.1) ובתרומה בשניים מארבעה: עיצוב עירוני, מרחב ציבורי, תועלת חברתית, שימור. בהתחדשות עירונית הוועדה רשאית לאשר עד המרבי בהחלטה מנומקת גם בלי התנאים.', when: 'תכנית מפורטת', strength: 'discretion', conf: 'high', src: ['p5000'] },
  { id: 't5000-rova', layer: 1, short: 'תא/5000 · יחס לרובעים', title: 'תכנית הרובע גוברת', value: 'בסתירה בין תא/5000 לתא/3616א (רובע 3) או לתא/3729א (רובע 4), גוברת תכנית הרובע, ורק לגבי המבנים שהיא חלה עליהם.', when: 'רובעים 3–4', strength: 'vested', conf: 'high', src: ['p5000'] },
  { id: 't5000-zone', layer: 1, short: 'תשריט ייעוד', title: 'סיווג החלקה בתשריט', value: 'המנוע מניח "אזור מגורים בבנייה עירונית" לרחובות ה-MVP. תשריט אזורי הייעוד של תא/5500 המופקדת (12/2025) מסמן את מרבית מרחבי התכנון 301, 401 ו-501 (רובעים 3, 4 ו-5) בצבע כתום, כלומר בנייה עירונית. התשריט של תא/5000 שבתוקף ונספח העיצוב (גבהים) עוד לא נבדקו.', when: 'כל חלקה', strength: 'vested', conf: 'medium', src: ['p5000', 'u5500map'] },
  { id: 't5500', layer: 1, short: 'תא/5500 · מופקדת', title: 'תא/5500 מחליפה את תא/5000', value: 'הופקדה ב-12/2025. שמיעת ההתנגדויות התחילה ב-3.11.2026. תשריט הייעוד: רובעים 3–5 בבנייה עירונית. תשריט העיצוב: מרחבים 301, 401 ו-501 עד 9 קומות, ובמרחבים 301 ו-501 גם ״מרקם בנוי לשימור״. גבול ההכרזה בתשריט עובר בארלוזורוב, באבן גבירול ובדוד המלך. תשריט התחבורה: הקו הירוק עם תחנות לאורך אבן גבירול. ההוראות (התקנון) לא נקראו.', when: 'כל העיר', strength: 'pending', conf: 'medium', src: ['u5500map', 'u5500design', 'u5500transit', 't5500'] },
  // Layer 2: Rova 3 (read from the scanned bylaws via OCR)
  { id: 'r3-plan', layer: 2, short: 'תא/3616א', title: 'תכנית רובע 3 בתוקף', value: 'אושרה 09.01.2018. "בניין קיים" = היתר ראשון לפני 27.6.2011. הזכויות הן שטחים כוללים (עיקרי + שירות), ומימושן מותנה בקווי הבניין ובמספר הקומות. זכויות שאי אפשר לממש מבוטלות (§2.2א). לא חלה על מבנים לשימור ועל החלקות לאורך אבן גבירול.', when: 'רובע 3', strength: 'vested', conf: 'high', src: ['p3616', 'r3notice'] },
  { id: 'r3-new-out', layer: 2, short: 'תא/3616א §2.2א(1)', title: 'רובע 3, בנייה חדשה מחוץ לאזור ההכרזה', value: 'צפונית לארלוזורוב. דיזנגוף ובן יהודה: 7 קומות + קומת גג חלקית (כולל קומה מסחרית). שאר הרחובות: 6 קומות + קומת גג חלקית (כולל קומת קרקע או עמודים), בלי קשר לגודל המגרש.', when: 'הריסה ובנייה', strength: 'vested', conf: 'high', src: ['p3616'] },
  { id: 'r3-new-decl', layer: 2, short: 'תא/3616א §2.2א(2)', title: 'רובע 3, בנייה חדשה באזור ההכרזה', value: 'דרומית לארלוזורוב. דיזנגוף ובן יהודה: 6 + גג חלקי. המלך ג׳ורג׳ ובוגרשוב (מגרש מסחרי): 5 + גג. מגרש של 500 מ״ר ומעלה, וכל המגרשים בארלוזורוב ובירקון: 6 + גג. מגרש קטן מ-500 מ״ר: 5 + גג. חריגה מהגובה או מקווי הבניין היא סטייה ניכרת.', when: 'הריסה ובנייה', strength: 'vested', conf: 'high', src: ['p3616'] },
  { id: 'r3-lot', layer: 2, short: 'תא/3616א §1.9', title: 'מגרש גדול וקטן', value: 'מגרש גדול: 500 מ״ר ומעלה. הסיווג נקבע לפי השטח נטו, אחרי הפקעות.', when: 'רובע 3', strength: 'vested', conf: 'high', src: ['p3616'] },
  { id: 'r3-add-outside', layer: 2, short: 'תא/3616א §2.2ב(1)', title: 'רובע 3, תוספת מחוץ לאזור ההכרזה', value: 'היתר עד 1.1.1980. דיזנגוף ובן יהודה (מגרש מסחרי): בניין עד 2 קומות משלים עד 5 + גג. 3 קומות ומעלה משלים עד 7 + גג. שאר המגרשים: בניין של 2–6 קומות מקבל +1 קומה + גג חלקי. 7 קומות ומעלה: +2 + גג. היתר אחרי 1980: חדרי יציאה לגג בלבד.', when: 'תוספת', strength: 'vested', conf: 'high', src: ['p3616'] },
  { id: 'r3-add-declared', layer: 2, short: 'תא/3616א §2.2ב(2)', title: 'רובע 3, תוספת באזור ההכרזה', value: 'היתר עד 1.1.1980. דיזנגוף ובן יהודה: עד 2 קומות משלים עד 5 + גג. 3 ומעלה משלים עד 6 + גג. שאר המגרשים: 2–4 קומות מקבלים +1 + גג חלקי. 5 קומות ומעלה: גג חלקי בלבד. תוספת מעבר לכך היא סטייה ניכרת.', when: 'תוספת', strength: 'vested', conf: 'high', src: ['p3616'] },
  { id: 'r3-add-area', layer: 2, short: 'תא/3616א §4.1.3ב(3)', title: 'שטח קומת תוספת', value: 'לפי קונטור הגג הקיים בלי מרפסות, ולא יותר משטח קומה טיפוסית. כולל עיקרי, שירות וממ״ד. מרפסות בנוסף. גובה קומה עד 3.40 מ׳. קומת קרקע, עמודים וקומת ביניים נספרות במניין הקומות.', when: 'תוספת', strength: 'vested', conf: 'high', src: ['p3616'] },
  { id: 'roof-decl', layer: 2, short: 'קומת גג · הכרזה', title: 'קומת גג באזור ההכרזה', value: 'תכסית הבנייה על הגג עד 65% משטח קומה טיפוסית (בלי מרפסות). נסיגה של 3 מ׳ מהחזית הקדמית. בבנייה חדשה גם 2 מ׳ מהאחורית. גובה עד 4.5 מ׳. חריגה היא סטייה ניכרת.', when: 'רובעים 3–4, אזור ההכרזה', strength: 'vested', conf: 'high', src: ['p3616', 'p3729'] },
  { id: 'roof-out', layer: 2, short: 'קומת גג · מחוץ להכרזה', title: 'קומת גג מחוץ לאזור ההכרזה', value: 'אין תקרה של 65%. התכסית על הגג עד השטח שבין הנסיגות: 3 מ׳ מהחזית הקדמית. בבנייה חדשה גם 2 מ׳ מהאחורית, ובתוספת שאר החזיתות לפי הקונטור הקיים.', when: 'רובעים 3–4, מחוץ להכרזה', strength: 'vested', conf: 'high', src: ['p3616', 'p3729'] },
  { id: 'r3-density', layer: 2, short: 'תא/3616א · צפיפות', title: 'מספר יח״ד בתוספת', value: 'בקומות החדשות: עד מספר הדירות בקומה הטיפוסית הקיימת. בקומת הגג: שטח חלקי 70. ברחוב מסחרי: שטח התוספת חלקי 65, ודירה מינימלית 47 מ״ר כולל ממ״ד. אם אי אפשר לממש את כל היח״ד, לא יאושרו בשבילן שטחים, קומות, הקלות או ניוד.', when: 'תוספת', strength: 'vested', conf: 'high', src: ['p3616'] },
  { id: 'rova-basement', layer: 2, short: 'רובעים 3–4 §4.1.2(ז)(3)', title: 'שטח עיקרי במרתף בהריסה ובנייה', value: '(א) דירה עצמאית בהיתר במרתף, שאינה מחוברת לקומת הקרקע, משוחזרת במרתף החדש עד שטחה הקיים, בנוסף לזכויות שמעל הקרקע. תוקן ב-16.9.2024 כך שיחול גם על שימוש שאינו עיקרי. (ב) לחלופין, מחוץ לאזור ההכרזה, ניוד השטח אל מעל הקרקע בהשלמת קומות או בקומה חלקית נוספת, בלי הקלה ובלי פרסום. ניוד כזה מותר רק אם הבקשה להיתר הוגשה עד 29.11.2015, והמרתף העליון ישמש לחניה בלבד.', when: 'הריסה ובנייה', strength: 'vested', conf: 'high', src: ['p3616', 'p3729'] },
  // Rova 4
  { id: 'r4-plan', layer: 2, short: 'תא/3729א', title: 'תכנית רובע 4 בתוקף', value: 'בין בני דן לשאול המלך, ובין אבן גבירול לנמיר ואיילון. לא כולל החלקות לאורך אבן גבירול, את המע״ר הצפוני, את מתחם 2000 ואת שכונת צמרת. לא חלה על מבנים לשימור.', when: 'רובע 4', strength: 'vested', conf: 'high', src: ['p3729'] },
  { id: 'r4-new', layer: 2, short: 'תא/3729א §2.2א', title: 'רובע 4, בנייה חדשה', value: 'רחובות ראשיים (נמיר, פנקס, ז׳בוטינסקי, ויצמן): 8 קומות + גג חלקי. ארלוזורוב: 7. רחובות לא ראשיים מחוץ להכרזה: 6 + שתי קומות גג חלקיות. בתכניות לבנייה נמוכה (117, 122, 196, 398, 478): 3–4 + גג. באזור ההכרזה (דוד המלך, דובנוב, שאול המלך): 6 + גג, וחריגה היא סטייה ניכרת.', when: 'הריסה ובנייה', strength: 'vested', conf: 'high', src: ['p3729'] },
  { id: 'r4-add', layer: 2, short: 'תא/3729א §2.2ב', title: 'רובע 4, תוספת', value: 'היתר לפני 1.1.1980. רחוב ראשי: השלמה עד 8 קומות + גג. רחוב לא ראשי, בניין עד 6 קומות: +1 + גג. 7 קומות ומעלה: +2 + גג מחוץ להכרזה, גג חלקי בלבד בהכרזה. בתכניות לבנייה נמוכה, בניין של 2 קומות: +165% משטח הגג. אחרי 1980: חדרי יציאה לגג בלבד.', when: 'תוספת', strength: 'vested', conf: 'high', src: ['p3729'] },
  { id: 'r4-low', layer: 2, short: 'תא/3729א §2.2א(3), §2.2ב(1)ה', title: 'רובע 4, תכניות לבנייה נמוכה (שיכונים)', value: 'בתחום תכניות 117, 122, 196, 398 ו-478. בנייה חדשה במגרש לבניין משותף: עד 3 או 4 קומות + גג חלקי (כולל קרקע), לפי מיקום המגרש בתשריט. המנוע מאמת 3 ומציג 4 בטווח. מגרש קוטג׳: רק חדר יציאה לגג או עליית גג. תוספת (היתר לפני 1980): רק בבניין משותף בן 2 קומות (צמוד קרקע או על עמודים), עד 165% משטח הגג הקיים, בקומה אחת + גג חלקי.', when: 'רובע 4, בנייה נמוכה', strength: 'vested', conf: 'high', src: ['p3729'] },
  { id: 'r4b', layer: 2, short: 'תא/3729ב', title: 'תיקון הוראות לבנייה נמוכה ברובע 4', value: 'בתוקף מ-18.5.2026. בבנייה חדשה: תוספת 6% משטח המגרש בקוטג׳ים בתחום 196 (שיכון הקצינים) ובתחום 398 באזורי מגורים א2 ו-ב2. בבניינים בקיר משותף: מימוש רק בבנייה משותפת בעת ובעונה אחת, למעט בתחום 117, 122 ו-478, שם מותר מימוש נפרד עד 3 קומות + גג חלקי. מסדירה גם את חלקות 544 ו-574 (תכנית 398, אזור ב2).', when: 'רובע 4, בנייה נמוכה', strength: 'vested', conf: 'high', src: ['p3729b'] },
  // Ibn Gabirol
  { id: 'ig-plan', layer: 2, short: 'תא/4562', title: 'תכנית אבן גבירול', value: 'בתוקף מ-12.12.2023 (שכבת התכניות העירונית). החלקות לאורך אבן גבירול הוצאו מרובעים 3–4. בנייה חדשה: עד 9 קומות מחוץ לאזור ההכרזה, עד 7 בתוכו. תוספת (הסעיף חל באזור ההכרזה בלבד): +1 קומה לפי הקונטור + גג חלקי, עד 5 קומות + חלקית. קומה מסחרית וקולונדה חובה. תכסית מרתף עד 85%.', when: 'אבן גבירול', strength: 'vested', conf: 'medium', src: ['p4562', 'gis'] },
  // Rova 5-6 (not yet read)
  { id: 'r56-plan', layer: 2, short: 'תא/מק/4320', title: 'תכנית רובעים 5–6', value: 'תכנית מכוח תיקון 139 (חלופת שקד, סעיף 70). אושרה בוועדה המחוזית ב-10/2026, אבל פרסום ברשומות לא אומת, ולכן עדיין לא זכות. לא חלה על מבנים לשימור (נשארים תחת תא/2650ב) ולא על מגרשים עם תכנית נקודתית. זכויות שאי אפשר לנצל מבוטלות. המנוע מחשב לפי נוסח שלב ההתנגדויות (05/2025). הנוסח הסופי לא נקרא.', when: 'רובעים 5–6', strength: 'pending', conf: 'high', src: ['p4320obj', 'marker'] },
  { id: 'r56-declared', layer: 2, short: 'תא/מק/4320 · בנייה חדשה', title: 'רובעים 5–6, בנייה חדשה', value: 'מגרש קטן מ-500 מ״ר: 5 קומות + גג חלקי, קו צד 2.5 מ׳, אחורי 4.5 מ׳. מגרש של 500 מ״ר ומעלה: 6 + גג, צד 3, אחורי 5. מגרש מסחרי (לא אלנבי): 5 + גג. אלנבי: 6. קו קדמי לפי תכנית תקפה. גג 65% בנסיגה 3/2 מ׳. מעל 750 מ״ר תכסית עד 55%. קומה עד 3.30 מ׳. התקרה הכוללת לפי סעיף 70ב: לבניין טעון חיזוק 325% מהמגרש (מתחת ל-500) או 390% (500 ומעלה), לבניין שאינו טעון חיזוק 250% או 300%. מרפסות: 14 מ״ר ליח״ד, בממוצע 12. מקדם צפיפות 80.', when: 'הריסה ובנייה', strength: 'pending', conf: 'medium', src: ['p4320obj'] },
  { id: 'r56-outside', layer: 2, short: 'תא/מק/4320 · תוספת', title: 'רובעים 5–6, תוספת', value: 'לבניינים טעוני חיזוק (סעיף 70א). עד 5 קומות + גג חלקי כולל קומת קרקע. בתכנית לב העיר עם קומת עמודים קיימת: 5 + גג מעל העמודים. ברחובות הירקון, אלנבי, בן יהודה, הרכבת, בגין ויהודה הלוי הדרומי: 6 + גג. סך השטח אחרי התוספת עד 200% מהקיים, ולא מעל 325% או 390% מהמגרש. אסור להפוך קומה בנויה לקומה מפולשת. הרחבות ברצף אנכי כולל ממ״ד.', when: 'תוספת', strength: 'pending', conf: 'medium', src: ['p4320obj'] },
  { id: 'r56-public', layer: 2, short: 'תא/מק/4320 · הקצאה', title: 'הקצאה לציבור בהריסה ובנייה', value: 'במגרש מעל 500 מ״ר שמוסיף 400 מ״ר ומעלה: שטח ציבורי מבונה בקומת הקרקע, 20% מהתוספת ולפחות 75 מ״ר, לגני ילדים, שירותי קהילה וכדומה. לא חל בתחום תכנית לב העיר. בנוסף ייגבה היטל השבחה.', when: 'הריסה ובנייה', strength: 'pending', conf: 'medium', src: ['p4320obj'] },
  { id: 'p2650', layer: 2, short: 'תא/2650ב', title: 'תכנית השימור', value: 'כ-190 מבנים בהגבלות מחמירות: ללא תוספת, הזכויות מועברות למגרש אחר. שימור רגיל: תמריצי תוספת (גג, צד, מרתף). "קומה אחת" לא אומת. תכניות הרובע לא חלות על מבנים לשימור.', when: 'מבנה לשימור', strength: 'vested', conf: 'low', src: ['g9077'] },
  // Layer 3: spatial guidelines
  { id: 'g-legal', layer: 3, short: 'סעיף 145ד', title: 'מעמד ההנחיות המרחביות', value: 'ההנחיות לא יכולות לסתור תכנית, להוסיף זכויות או לגרוע מהן. הן מחייבות בתכנון ובעיצוב. נבדק: מהדורה 7 ותא/9077 לא עוסקות כלל במרתפים או בניוד שטחים. סעיף הניוד נמצא בתכניות הרובע עצמן.', when: 'תמיד', strength: 'vested', conf: 'high', src: ['law145', 'g7', 'g9077'] },
  { id: 'g-contour', layer: 3, short: 'הנחיות §3.3–3.6', title: 'קונטור וגובה קומות', value: 'אין בליטה מעבר לקונטור הקומה הטיפוסית. קומות עליונות לא בולטות מעבר לקומות שמתחתיהן. מרפסת גג לא בולטת מעבר לקומה שמתחת. בתוספת, גובה הקומות החדשות זהה לקומה הטיפוסית.', when: 'תוספת ובנייה חדשה', strength: 'guideline', conf: 'high', src: ['g7'] },
  { id: 'g-balc-city', layer: 3, short: 'הנחיות §3.33', title: 'גזוזטרות, כלל עירוני', value: 'חופפות ומקורות בכל החזיתות, בליטה אחידה, בלי מרפסות "מדלגות". אורך שונה מותר רק בקומה האחרונה שאינה גג, עד 2/3 מאורך החזית. בבנייה בקיר משותף, 0.75 מ׳ מהגבול. ככלל, אין סגירת מרפסות.', when: 'בנייה חדשה ותוספת', strength: 'guideline', conf: 'high', src: ['g7'] },
  { id: 'r3-balc', layer: 3, short: 'רובעים 3–4 · מרפסות', title: 'מרפסות לפי תכנית הרובע', value: 'בבנייה חדשה, עד 14 מ״ר ליח״ד מעבר לשטחים המרביים, בממוצע 12 מ״ר. בליטה של עד 1.6 מ׳, ובבן יהודה ובארלוזורוב 1.2 מ׳ בחזית. אסור לסגור אותן, ונרשמת הערה לפי תקנה 27. בהכרזה: אורך מרפסת חזית עד 2/3 מהחזית, ואין מרפסות חזית חדשות בקומות הקיימות.', when: 'רובעים 3–4', strength: 'vested', conf: 'high', src: ['p3616', 'p3729'] },
  { id: 'r3-ground', layer: 3, short: 'רובעים 3–4 · קומת קרקע', title: 'רצועה מפולשת בקומת הקרקע', value: 'מותר לבנות קומת קרקע מלאה או חלקית, אם בחזית לרחוב נשארת רצועה מפולשת של 3.0 מ׳ לפחות מקו הבניין. בחזית מעל 30 מ׳ הרצועה היא לפחות 2/3 מהאורך, ובבניין פינתי לפחות מחצית. תא/9077 §1.1 מחייבת זאת גם בהכרזה.', when: 'רובעים 3–4', strength: 'vested', conf: 'high', src: ['p3616', 'g9077'] },
  { id: 'g-ground', layer: 3, short: 'הנחיות · קומת קרקע', title: 'גובה קומת קרקע', value: 'בבניין מגורים בלי חזית מסחרית: עד 3.5 מ׳, ועד 4 מ׳ כשנדרשת מעלית רכב. עם חזית מסחרית: עד 4.5 מ׳. אין יציאה מדירות בקומת הקרקע לחזית הרחוב (§3.15).', when: 'בנייה חדשה', strength: 'guideline', conf: 'high', src: ['g7'] },
  { id: 'g-balc-decl', layer: 3, short: 'תא/9077 §7', title: 'סגירת מרפסות באזור ההכרזה', value: 'סגירת מרפסות בקומות קיימות מותנית בחוות דעת מהנדס העיר ובחידוש החזית כולה. בקומות התוספת סגירה רק לפי חוות דעת מחלקת השימור, ובזכוכית בלבד.', when: 'אזור ההכרזה', strength: 'guideline', conf: 'high', src: ['g9077'] },

function Info({ k, text, className = '' }) {
  const [pos, setPos] = useState(null);
  const ref = useRef(null);
  useEffect(() => {
    if (!pos) return;
    const close = e => { if (ref.current && !ref.current.contains(e.target)) setPos(null); };
    const esc = e => { if (e.key === 'Escape') setPos(null); };
    const sc = () => setPos(null);
    document.addEventListener('mousedown', close); window.addEventListener('keydown', esc); window.addEventListener('scroll', sc, true);
    return () => { document.removeEventListener('mousedown', close); window.removeEventListener('keydown', esc); window.removeEventListener('scroll', sc, true); };
  }, [pos]);
  const t = text || INFO[k];
  if (!t) return null;
  const toggle = e => {
    e.stopPropagation(); e.preventDefault();
    if (pos) { setPos(null); return; }
    const r = ref.current.getBoundingClientRect();
    setPos({ x: r.left + r.width / 2, top: r.bottom + 6, up: r.bottom > window.innerHeight - 200 ? window.innerHeight - r.top + 6 : null });
  };
  return (
    <span className={`inline-flex align-middle ${className}`}>
      <button ref={ref} type="button" onClick={toggle} aria-expanded={!!pos} aria-label="הסבר"
        className={`w-[15px] h-[15px] rounded-full border text-[9.5px] font-bold leading-none grid place-items-center shrink-0 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/50 ${pos ? 'border-accent bg-accent text-white' : 'border-ink-4 text-ink-3 hover:border-accent hover:text-accent bg-white'}`} style={{ fontFamily: 'Georgia, serif', fontStyle: 'italic' }}>i</button>
      {pos && (
        <span role="tooltip" onMouseDown={e => e.stopPropagation()}
          className="fixed z-[95] w-[270px] max-w-[calc(100vw-24px)] bg-ink text-white text-[12px] leading-relaxed font-normal normal-case tracking-normal rounded-lg px-3 py-2 shadow-pop text-start whitespace-normal"
          style={{ left: Math.max(12, Math.min(pos.x - 135, window.innerWidth - 282)), ...(pos.up != null ? { bottom: pos.up } : { top: pos.top }) }}>{t}</span>
      )}
    </span>
  );
}

  { title: 'סף החלטה', fields: [
    { k: 'minProfit', label: 'רווח יזמי מינימלי', unit: '% מסך העלויות', ph: '18' }] }
];
const DEV_FIELDS = DEV_GROUPS.flatMap(g => g.fields);
const saleKey = z => 'sale_' + (z === '5-6' ? '56' : z);

function econ(p, dev) {
  if (!dev) return { state: 'none' };
  const z = p.inputs.rova, sale = +dev[saleKey(z)] || 0;
  const need = [];
  if (!sale) need.push(saleKey(z));
  if (!(+dev.minProfit >= 0) || dev.minProfit === '' || dev.minProfit == null) need.push('minProfit');
  const net = (+dev.netRatio || 0) / 100;
  if (!net) need.push('netRatio');
  if (need.length) return { state: 'missing', need };
  const c = p.calc, U = Math.max(1, p.units || 1), E = c.existing, oSqm = +dev.ownerSqm || 0;
  const scen = [];
  for (const s0 of [c.add, c.reb]) {
    if (!s0.available || s0.delta <= 0) continue;
    const isAdd = s0.id === 'add', rate = +(isAdd ? dev.costAdd : dev.costRebuild) || 0;
    if (!rate) { need.push(isAdd ? 'costAdd' : 'costRebuild'); continue; }
    const build = isAdd ? s0.area + U * oSqm : s0.total;
    const saleable = isAdd ? s0.area : s0.total - (E + U * oSqm);
    if (isAdd && !(+dev.retrofit >= 0 && dev.retrofit !== '' && dev.retrofit != null)) { need.push('retrofit'); continue; }
    const construction = build * rate + (isAdd ? E * (+dev.retrofit || 0) : 0);
    const soft = construction * ((+dev.soft || 0) + (+dev.finance || 0)) / 100;
    const owners = isAdd ? 0 : U * ((+dev.parking || 0) + (+dev.rent || 0) * (+dev.months || 0));
    const revenue = saleable * net * sale;
    const levy = (z === '5-6' || z === 'ig') ? revenue * (+dev.levy56 || 0) / 100 : 0;
    const cost = construction + soft + owners + levy;
    const profit = revenue - cost;
    scen.push({ id: s0.id, label: s0.label, build, saleable, construction, soft, owners, levy, revenue, cost, profit, pct: cost > 0 ? profit / cost : 0 });
  }
  if (need.length && !scen.length) return { state: 'missing', need: [...new Set(need)] };
  if (!scen.length) return { state: 'nodelta' };
  scen.sort((a, b) => b.profit - a.profit);
  const best = scen[0], min = (+dev.minProfit || 0) / 100;
  return { state: 'ok', best, scen, ok: best.pct >= min, min, sale, net, U, pend: c.pend, need: [...new Set(need)] };
}

function nadlanRef(p) {
  if (!NADLAN) return null;
  const z = p.inputs.rova;
  const fb = { '3': p.inputs.declared ? 'הצפון הישן החלק הדר' : 'הצפון הישן-החלק הצפ', '4': 'הצפון החדש החלק הדר', '5-6': 'לב העיר', 'ig': 'הצפון הישן החלק הדר' }[z];
  const direct = NADLAN.streetToNb[p.street];
  const name = direct || fb, nb = NADLAN.neighborhoods[name];
  return nb ? { name, rooms: nb.rooms, exact: !!direct, version: NADLAN.version } : null;
}

    const timer = setTimeout(() => { if (!dead) setSt(s => s.src === 'loading' ? { values: local(), src: 'local', note: 'שרת ההגדרות לא ענה. מוצגים הערכים השמורים בדפדפן.' } : s); }, 10000);
    (async () => {
      const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
      if (dead) return;
      if (!db) { clearTimeout(timer); setSt({ values: local(), src: 'local', note: 'שמירה משותפת לא זמינה בתצוגה הזו. הערכים נשמרים בדפדפן בלבד.' }); return; }
      ref.current = db.doc('settings/dev');
      unsub = ref.current.onSnapshot(snap => {
        if (snap.metadata && snap.metadata.fromCache && !snap.exists) return;
        clearTimeout(timer);
        const d = snap.exists ? snap.data() : null;
        setSt({ values: d ? d.values : null, updatedAt: d ? d.updatedAt : null, src: 'db' });
      }, e => { clearTimeout(timer); setSt({ values: local(), src: 'local', note: 'שרת ההגדרות לא זמין. מוצגים הערכים השמורים בדפדפן.' }); });
    })();
    return () => { dead = true; clearTimeout(timer); if (unsub) unsub(); };
  }, []);
  const save = async values => {
    try { localStorage.setItem('israprop.dev.v1', JSON.stringify(values)); } catch (e) {}
    if (ref.current) {
      try { await ref.current.set({ values, updatedAt: new Date().toISOString() }); return { ok: true, shared: true }; }
      catch (e) { setSt(s => ({ ...s, values })); return { ok: true, shared: false, code: e && e.code }; }
    }
    setSt(s => ({ ...s, values, updatedAt: new Date().toISOString() }));
    return { ok: true, shared: false };
  };
  return [st, save];
}

/* Listings the user entered: shared via db collection 'listings' (one doc per block-parcel) when the Claude runtime is present, else browser storage. */
function useListings() {
  const [st, setSt] = useState({ map: {}, src: 'loading', v: 0 });
  const col = useRef(null);
  const local = () => { try { return JSON.parse(localStorage.getItem('israprop.listings.v1') || '{}') || {}; } catch (e) { return {}; } };
  const apply = (map, src, note) => { LISTINGS = map; PCACHE.clear(); setSt(s => ({ map, src, note, v: s.v + 1 })); };
  useEffect(() => {
    let unsub = null, dead = false;
    const timer = setTimeout(() => { if (!dead && !col.current) apply(local(), 'local', 'שמירה משותפת לא ענתה. המודעות נשמרות בדפדפן בלבד.'); }, 10000);
    (async () => {
      const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
      if (dead) return;
      if (!db) { clearTimeout(timer); apply(local(), 'local', 'באתר הזה המודעות נשמרות בדפדפן שלכם בלבד.'); return; }
      col.current = db.collection('listings');
      unsub = col.current.onSnapshot(snap => {
        if (snap.metadata && snap.metadata.fromCache && snap.empty) return;
        clearTimeout(timer);
        const map = {}; snap.docs.forEach(d => { if (d.exists) map[d.id] = d.data(); });
        apply(map, 'db', 'משותף לכל מי שעורך את הכלי.');
      }, () => { clearTimeout(timer); col.current = null; apply(local(), 'local', 'שמירה משותפת לא זמינה. המודעות נשמרות בדפדפן בלבד.'); });
    })();
    return () => { dead = true; clearTimeout(timer); if (unsub) unsub(); };
  }, []);
  const write = async (key, data) => {
    const map = { ...LISTINGS }; if (data) map[key] = data; else delete map[key];
    try { localStorage.setItem('israprop.listings.v1', JSON.stringify(map)); } catch (e) {}
    if (col.current) {
      try { if (data) await col.current.doc(key).set(data); else await col.current.doc(key).delete(); return { ok: true, shared: true }; }
      catch (e) { apply(map, 'local', 'השמירה המשותפת נכשלה. נשמר בדפדפן בלבד.'); return { ok: true, shared: false }; }
    }
    apply(map, 'local', st.note);
    return { ok: true, shared: false };
  };
  return [st, write];
}
const ListingCtx = React.createContext({ st: { src: 'local' }, write: async () => ({ ok: false }) });

/* =========================================================================
   6. LEFT COLUMN (start side in RTL): cadastral map + density metrics

function CadastralMap({ parcels, visibleIds, selectedId, onSelect, highlightId, setHighlightId }) {
  const [zoom, setZoom] = useState(1.1);
  const [showGush, setShowGush] = useState(true);
  const [tip, setTip] = useState(null);
  const wrapRef = useRef(null);

  const layout = useMemo(() => {
    const byStreet = [];
    parcels.forEach(p => { let g = byStreet.find(b => b.streetId === p.streetId); if (!g) byStreet.push(g = { streetId: p.streetId, items: [] }); g.items.push(p); });
    const DEPTH = 66, ROAD = 24, GAP = 3, PAD = 14, LABEL = 16;
    const bandH = LABEL + DEPTH + 6 + ROAD + 6 + DEPTH + 16;
    let maxW = 0;
    const bands = byStreet.map((g, bi) => {
      const S = ST(g.streetId);
      const top = g.items.filter(p => p.num % 2 === 0).sort((a, b) => a.num - b.num);
      const bot = g.items.filter(p => p.num % 2 === 1).sort((a, b) => a.num - b.num);
      const slots = Math.max(top.length, bot.length);
      const crossEvery = Math.max(3, Math.ceil(slots / (S.cross.length + 1)));
      const y0 = bi * bandH;
      const roadY = y0 + LABEL + DEPTH + 6;
      let cursor = PAD;
      const shapes = [], crosses = [];
      for (let i = 0; i < slots; i++) {
        if (i > 0 && i % crossEvery === 0 && crosses.length < S.cross.length) { crosses.push({ x: cursor + 3, name: S.cross[crosses.length] }); cursor += 22; }
        const t = top[i], b = bot[i];
        const w = Math.max(t ? 26 + t.footprint / 14 : 0, b ? 26 + b.footprint / 14 : 0);
        if (t) { const h = 44 + Math.max(0, Math.min(1, (t.footprint - 130) / 260)) * 22; shapes.push({ p: t, x: cursor, y: roadY - 6 - h, w, h }); }
        if (b) { const h = 44 + Math.max(0, Math.min(1, (b.footprint - 130) / 260)) * 22; shapes.push({ p: b, x: cursor, y: roadY + ROAD + 6, w, h }); }
        cursor += w + GAP;
      }
      maxW = Math.max(maxW, cursor + PAD);
      return { S, streetId: g.streetId, y0, roadY, shapes, crosses, width: cursor + PAD };
    });
    // Mirror horizontally so house numbers start at the right (RTL reading)
    bands.forEach(b => { b.shapes.forEach(s => { s.x = maxW - s.x - s.w; }); b.crosses.forEach(c => { c.x = maxW - c.x - 16; }); });
    // Gush runs per side
    bands.forEach(b => {
      b.gushRuns = [];
      ['top', 'bot'].forEach(side => {
        const list = b.shapes.filter(s => side === 'top' ? s.p.num % 2 === 0 : s.p.num % 2 === 1).sort((a, c) => a.x - c.x);
        let run = null;
        list.forEach(s => {
          if (run && run.gush === s.p.gush) { run.x1 = s.x + s.w; run.y0 = Math.min(run.y0, s.y); run.y1 = Math.max(run.y1, s.y + s.h); }
          else { if (run) b.gushRuns.push(run); run = { side, gush: s.p.gush, x0: s.x, x1: s.x + s.w, y0: s.y, y1: s.y + s.h }; }
        });
        if (run) b.gushRuns.push(run);
      });
    });
    return { bands, W: maxW, H: bands.length * bandH, ROAD };
  }, [parcels]);

  const fillOpacity = p => p.highConviction ? 0.9 : p.status === 'signed' ? 0.38 : p.status === 'clean' ? 0.5 : 0.72;
  const onMove = (e, p) => {
    setTip({ p, x: e.clientX, y: e.clientY });
    setHighlightId(p.id);
  };

  return (
    <Card className="overflow-hidden">
      <div className="flex items-center justify-between px-3 py-2 border-b border-line">
        <div>
          <div className="text-[13px] font-bold text-ink flex items-center gap-1">מפה קדסטרלית <Info k="map" /></div>
          <div className="text-2xs text-ink-3">שכבת גוש/חלקה · צבע לפי סיגנל · גררו לצדדים</div>
        </div>
        <div className="flex items-center gap-1">
          <button onClick={() => setShowGush(v => !v)} aria-pressed={showGush} className={`h-7 px-2 rounded-md text-2xs font-semibold border ${showGush ? 'bg-accent-soft text-accent border-accent/20' : 'border-line text-ink-3'}`}>גושים</button>
          <button onClick={() => setZoom(z => Math.max(0.6, +(z - 0.25).toFixed(2)))} className="w-7 h-7 grid place-items-center rounded-md border border-line text-ink-2 hover:bg-canvas" aria-label="הקטנה"><Icon name="minus" className="w-3.5 h-3.5" /></button>
          <button onClick={() => setZoom(z => Math.min(2.5, +(z + 0.25).toFixed(2)))} className="w-7 h-7 grid place-items-center rounded-md border border-line text-ink-2 hover:bg-canvas" aria-label="הגדלה"><Icon name="plus" className="w-3.5 h-3.5" /></button>
        </div>
      </div>
      <div ref={wrapRef} className="relative overflow-auto scroll-thin bg-[#FBFCFD]" style={{ maxHeight: 360 }} onMouseLeave={() => { setTip(null); setHighlightId(null); }}>
        <svg viewBox={`0 0 ${layout.W} ${layout.H}`} width={layout.W * zoom} height={layout.H * zoom} style={{ display: 'block', maxWidth: 'none' }} role="img" aria-label="מפת חלקות" direction="ltr">
          <defs>
            <pattern id="blockgrid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#EEF1F5" strokeWidth="0.6" /></pattern>
          </defs>
          <rect x="0" y="0" width={layout.W} height={layout.H} fill="url(#blockgrid)" />
          {layout.bands.map(b => (
            <g key={b.streetId}>
              <rect x="0" y={b.roadY} width={layout.W} height={layout.ROAD} fill="#E8ECF1" />
              <line x1="0" x2={layout.W} y1={b.roadY + layout.ROAD / 2} y2={b.roadY + layout.ROAD / 2} stroke="#FFFFFF" strokeWidth="1.2" strokeDasharray="6 5" />
              {b.crosses.map(c => (
                <g key={c.name}>
                  <rect x={c.x} y={b.y0 + 14} width="16" height={b.roadY - b.y0 - 14 + layout.ROAD + 82} fill="#E8ECF1" />
                  <text x={c.x + 8} y={b.roadY + layout.ROAD / 2} fontSize="7.5" fill="#64748B" textAnchor="middle" transform={`rotate(-90 ${c.x + 8} ${b.roadY + layout.ROAD / 2})`} dy="2.6" style={{ fontFamily: 'Heebo' }}>{c.name}</text>
                </g>
              ))}
              {[0.2, 0.75].map(f => (
                <text key={f} x={layout.W * f} y={b.roadY + layout.ROAD / 2 + 3.5} fontSize="10" fontWeight="700" fill="#334155" textAnchor="middle" style={{ fontFamily: 'Heebo' }} paintOrder="stroke" stroke="#E8ECF1" strokeWidth="3">{b.S.he}</text>
              ))}
              {showGush && b.gushRuns.map((g, i) => (
                <g key={i}>
                  <rect x={g.x0 - 2.5} y={g.y0 - 2.5} width={g.x1 - g.x0 + 5} height={g.y1 - g.y0 + 5} fill="none" stroke="#2563EB" strokeOpacity="0.5" strokeWidth="1" strokeDasharray="3 2.5" rx="3" />
                  <text x={g.x1 - 2} y={g.side === 'top' ? g.y0 - 5 : g.y1 + 11} fontSize="7.5" fontWeight="600" fill="#2563EB" textAnchor="end" style={{ fontFamily: 'Heebo' }}>גוש {g.gush}</text>
                </g>
              ))}
              {b.shapes.map(({ p, x, y, w, h }) => {
                const st = STATUS[p.status];
                const dim = visibleIds && !visibleIds.has(p.id);
                const sel = p.id === selectedId, hov = p.id === highlightId;
                return (
                  <g key={p.id} opacity={dim ? 0.22 : 1}>
                    <rect className="parcel" tabIndex={0} role="button" aria-label={`${p.address}, ${st.label}`}
                      x={x} y={y} width={w} height={h} rx="2.5"
                      fill={st.color} fillOpacity={fillOpacity(p)}
                      stroke={sel ? '#2563EB' : hov ? '#0F172A' : '#FFFFFF'} strokeWidth={sel ? 2.5 : hov ? 1.4 : 1.2}
                      onClick={() => onSelect(p)} onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(p); } }}
                      onMouseMove={e => onMove(e, p)} />
                    <text x={x + w / 2} y={y + h / 2 + 3.5} fontSize="10" fontWeight="700" fill="#0F172A" textAnchor="middle" pointerEvents="none" style={{ fontFamily: 'Inter' }}>{p.num}</text>
                    {p.preservation && <path d={`M${x + 5} ${y + 4} l3 3 -3 3 -3 -3z`} fill="#B45309" pointerEvents="none" />}
                    {p.highConviction && <circle cx={x + w - 5.5} cy={y + 5.5} r="2.6" fill="#FFFFFF" stroke="#047857" strokeWidth="1.2" pointerEvents="none" />}
                  </g>
                );
              })}
            </g>
          ))}
        </svg>
        {tip && (
          <div className="pointer-events-none fixed z-[65] bg-ink text-white rounded-lg px-2.5 py-2 text-[11.5px] shadow-pop w-max max-w-[220px]"
            style={{ left: Math.max(8, Math.min(tip.x + 14, window.innerWidth - 232)), top: Math.min(tip.y + 16, window.innerHeight - 110) }}>
            <div className="font-bold text-[12.5px]">{tip.p.address}</div>
            <div className="text-white/70">גוש <Num>{tip.p.gush}</Num> · חלקה <Num>{tip.p.chelka}</Num> · <Num>{tip.p.year}</Num></div>
            <div className="mt-1 flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style={{ background: STATUS[tip.p.status].color }} />{STATUS[tip.p.status].label}</div>
            <div className="mt-0.5">יתרת זכויות <Num className="font-bold">+{n0(tip.p.unused)} מ״ר</Num> · ציון <Num className="font-bold">{tip.p.score}</Num></div>
          </div>
        )}
      </div>
      <div className="px-3 py-2 border-t border-line flex flex-wrap gap-x-3 gap-y-1">
        {Object.entries(STATUS).map(([k, s]) => (
          <span key={k} className="inline-flex items-center gap-1.5 text-2xs text-ink-2"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: s.color }} />{s.label}</span>
        ))}
        <span className="inline-flex items-center gap-1.5 text-2xs text-ink-2"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 1l4 4-4 4-4-4z" fill="#B45309" /></svg>מבנה לשימור</span>
        <span className="inline-flex items-center gap-1.5 text-2xs text-ink-2"><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3" fill="#fff" stroke="#047857" strokeWidth="1.4" /></svg>ודאות גבוהה</span>
      </div>
    </Card>
  );
}


function RealCadastralMap({ parcels, visibleIds, selectedId, onSelect, highlightId, setHighlightId }) {
  const [zoom, setZoom] = useState(1);
  const [tip, setTip] = useState(null);
  const geo = useMemo(() => {
    const cs = parcels.map(p => { const r = p.poly; return [r.reduce((a, q) => a + q[0], 0) / r.length, r.reduce((a, q) => a + q[1], 0) / r.length]; });
    const mx = cs.reduce((a, c) => a + c[0], 0) / cs.length, my = cs.reduce((a, c) => a + c[1], 0) / cs.length;
    let sxx = 0, syy = 0, sxy = 0; cs.forEach(([x, y]) => { sxx += (x - mx) ** 2; syy += (y - my) ** 2; sxy += (x - mx) * (y - my); });
    const ang = 0.5 * Math.atan2(2 * sxy, sxx - syy), ca = Math.cos(-ang), sa = Math.sin(-ang);
    const tr = ([x, y]) => { const dx = x - mx, dy = y - my; return [-(dx * ca - dy * sa), -(dx * sa + dy * ca)]; };
    const polys = parcels.map((p, i) => ({ p, pts: p.poly.map(tr), c: tr(cs[i]) }));
    const all = polys.flatMap(o => o.pts);
    const xs = all.map(q => q[0]), ys = all.map(q => q[1]);
    const minX = Math.min(...xs), minY = Math.min(...ys);
    return { polys, minX, minY, W: Math.max(...xs) - minX, H: Math.max(...ys) - minY };
  }, [parcels]);
  const s = (geo.W > 1500 ? 330 / (geo.W + 16) : 2.2) * zoom, pad = 8;
  const fillOpacity = p => p.highConviction ? 0.9 : p.status === 'signed' ? 0.38 : p.status === 'clean' ? 0.5 : 0.72;
  return (
    <Card className="overflow-hidden">
      <div className="flex items-center justify-between px-3 py-2 border-b border-line">
        <div>
          <div className="text-[13px] font-bold text-ink flex items-center gap-1">מפה קדסטרלית <Info k="map" /></div>
          <div className="text-2xs text-ink-3">פוליגוני חלקות אמיתיים · GIS עירוני · מסובב לאורך הרחוב</div>
        </div>
        <div className="flex items-center gap-1">
          <button onClick={() => setZoom(z => Math.max(0.4, +(z - 0.2).toFixed(2)))} className="w-7 h-7 grid place-items-center rounded-md border border-line text-ink-2 hover:bg-canvas" aria-label="הקטנה"><Icon name="minus" className="w-3.5 h-3.5" /></button>
          <button onClick={() => setZoom(z => Math.min(3, +(z + 0.2).toFixed(2)))} className="w-7 h-7 grid place-items-center rounded-md border border-line text-ink-2 hover:bg-canvas" aria-label="הגדלה"><Icon name="plus" className="w-3.5 h-3.5" /></button>
        </div>
      </div>
      <div className="relative overflow-auto scroll-thin bg-[#FBFCFD]" style={{ maxHeight: 360 }} onMouseLeave={() => { setTip(null); setHighlightId(null); }}>
        <svg viewBox={`${geo.minX - pad} ${geo.minY - pad} ${geo.W + 2 * pad} ${geo.H + 2 * pad}`} width={(geo.W + 2 * pad) * s} height={(geo.H + 2 * pad) * s} style={{ display: 'block', maxWidth: 'none', direction: 'ltr' }} role="img" aria-label="מפת חלקות">
          {geo.polys.map(({ p, pts, c }) => {
            const st = STATUS[p.status]; const dim = visibleIds && !visibleIds.has(p.id); const sel = p.id === selectedId, hov = p.id === highlightId;
            return (
              <g key={p.id} opacity={dim ? 0.22 : 1}>
                <polygon className="parcel" tabIndex={0} role="button" aria-label={`${p.address}, ${st.label}`} points={pts.map(q => q.join(',')).join(' ')}
                  fill={st.color} fillOpacity={fillOpacity(p)} stroke={sel ? '#2563EB' : hov ? '#0F172A' : '#FFFFFF'} strokeWidth={sel ? 1.4 : hov ? 0.8 : 0.5}
                  onClick={() => onSelect(p)} onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(p); } }}
                  onMouseMove={e => { setTip({ p, x: e.clientX, y: e.clientY }); setHighlightId(p.id); }} />
                <text x={c[0]} y={c[1] + 1.4} fontSize="4" fontWeight="700" fill="#0F172A" textAnchor="middle" pointerEvents="none" style={{ fontFamily: 'Inter' }}>{p.num}</text>
                {p.preservation && <circle cx={c[0]} cy={c[1] - 4} r="1.1" fill="#B45309" pointerEvents="none" />}
              </g>
            );
          })}
        </svg>
        {tip && (
          <div className="pointer-events-none fixed z-[65] bg-ink text-white rounded-lg px-2.5 py-2 text-[11.5px] shadow-pop w-max max-w-[230px]" style={{ left: Math.max(8, Math.min(tip.x + 14, window.innerWidth - 242)), top: Math.min(tip.y + 16, window.innerHeight - 110) }}>

            <div className="mt-1 flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style={{ background: STATUS[tip.p.status].color }} />{STATUS[tip.p.status].label}</div>
            <div className="mt-0.5">יתרת זכויות <Num className="font-bold">+{n0(tip.p.unused)} מ״ר</Num> · ציון <Num className="font-bold">{tip.p.score}</Num></div>
          </div>
        )}
      </div>
      <div className="px-3 py-2 border-t border-line flex flex-wrap gap-x-3 gap-y-1">
        {Object.entries(STATUS).map(([k, st]) => <span key={k} className="inline-flex items-center gap-1.5 text-2xs text-ink-2"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: st.color }} />{st.label}</span>)}
        <Info k="legend" />
        <span className="inline-flex items-center gap-1.5 text-2xs text-ink-2"><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3" fill="#B45309" /></svg>מבנה לשימור</span>
      </div>

}
const MapSwitch = props => props.parcels.length && props.parcels.every(p => p.poly) ? <RealCadastralMap {...props} /> : <CadastralMap {...props} />;

function DensityMetrics({ parcels, target }) {
  const total = parcels.length;
  const hc = parcels.filter(p => p.highConviction).length;
  const signed = parcels.filter(p => p.status === 'signed').length;
  const avgUnused = total ? parcels.reduce((a, p) => a + p.unusedRatio, 0) / total : 0;
  const unusedSqm = parcels.reduce((a, p) => a + (p.status === 'signed' ? 0 : p.unused), 0);
  const counts = Object.keys(STATUS).map(k => ({ k, n: parcels.filter(p => p.status === k).length }));
  const tiles = [
    { info: 't_total', label: 'בניינים שנסרקו', value: total, sub: target?.type === 'hood' ? 'בשכונה הנבחרת' : 'ברחוב הנבחר' },
    { info: 't_hc', label: 'הזדמנויות ארביטראז׳ בוודאות גבוהה', value: hc, sub: `${pct(total ? hc / total : 0)} מהבניינים`, tone: 'text-go-ink' },
    { info: 't_signed', label: 'פרויקט פעיל · היתר או בניין חדש', value: signed, sub: 'ברשימת דילוג', tone: 'text-skip-ink' },
    { info: 't_ratio', label: 'יחס זכויות לא מנוצלות (ממוצע)', value: pct(avgUnused), sub: <>+<Num>{n0(unusedSqm)}</Num> מ״ר פנויים ללא יזם</> }
  ];
  return (
    <Card className="p-3">
      <div className="flex items-baseline justify-between mb-2.5">
        <div className="text-[13px] font-bold text-ink flex items-center gap-1">מדדי צפיפות חלקות <Info k="density" /></div>
        <div className="text-2xs text-ink-3">{target?.he}</div>
      </div>
      <div className="grid grid-cols-2 gap-px bg-line rounded-lg overflow-hidden border border-line">
        {tiles.map(t => (
          <div key={t.label} className="bg-white p-2.5 min-w-0">
            <div className="text-2xs text-ink-3 leading-snug min-h-[28px]">{t.label} <Info k={t.info} /></div>
            <div className={`num text-[22px] font-bold leading-none mt-1 ${t.tone || 'text-ink'}`}>{t.value}</div>
            <div className="text-2xs text-ink-3 mt-1">{t.sub}</div>
          </div>
        ))}
      </div>
      <div className="mt-3">
        <div className="flex items-center justify-between mb-1.5">
          <span className="eyebrow inline-flex items-center gap-1">פילוח סטטוס <Info k="breakdown" /></span>
          <span className="text-2xs text-ink-3"><Num>{total}</Num> חלקות</span>
        </div>
        <div className="flex h-2.5 gap-[2px]" role="img" aria-label="פילוח בניינים לפי סטטוס">
          {counts.filter(c => c.n).map((c, i, arr) => (
            <span key={c.k} title={`${STATUS[c.k].label}: ${c.n}`} style={{ width: `${c.n / total * 100}%`, background: STATUS[c.k].color }}
              className={`${i === 0 ? 'rounded-s' : ''} ${i === arr.length - 1 ? 'rounded-e' : ''}`} />
          ))}
        </div>
        <div className="grid grid-cols-2 gap-x-3 gap-y-1 mt-2">
          {counts.map(c => (
            <div key={c.k} className="flex items-center justify-between text-2xs">
              <span className="inline-flex items-center gap-1.5 text-ink-2 min-w-0 truncate"><span className="w-2 h-2 rounded-sm shrink-0" style={{ background: STATUS[c.k].color }} />{STATUS[c.k].label}</span>
              <Num className="font-semibold text-ink">{c.n}</Num>
            </div>
          ))}
        </div>
      </div>
    </Card>
  );
}

/* =========================================================================
   7. MIDDLE COLUMN: opportunity feed
   ========================================================================= */
const TABS = [
  { id: 'all', label: 'כל הבניינים ברחוב', test: () => true },
  { id: 'hc', label: 'ארביטראז׳ בוודאות גבוהה', test: p => p.highConviction },
  { id: 'skip', label: 'פרויקטים פעילים של יזמים (דילוג)', test: p => p.status === 'signed' || (p.status === 'file' && p.developer) }
];
const SORTS = {
  score: { label: 'ציון AI', get: p => p.score },
  address: { label: 'כתובת', get: p => p.street + String(p.num).padStart(4, '0') },
  verified: { label: 'זכויות מאומתות', get: p => p.verifiedAdd ?? -1 },
  unused: { label: 'טווח (עליון)', get: p => p.rangeHi },
  ratio: { label: 'יחס לא מנוצל', get: p => p.unusedRatio },
  uplift: { label: 'מודעה מתחת לשכונה', get: p => p.discount ?? -9 },
  profit: { label: 'רווח יזמי', get: p => p.econ && p.econ.state === 'ok' ? p.econ.best.profit : -1e15 },
  profitPct: { label: 'רווח יזמי %', get: p => p.econ && p.econ.state === 'ok' ? p.econ.best.pct : -1e9 },
  year: { label: 'שנת בנייה', get: p => p.year }
};

function SortTh({ k, sort, setSort, children, className = '', info }) {
  const active = sort.key === k;
  return (
    <th className={`px-2.5 py-2 font-semibold text-start whitespace-nowrap ${className}`} aria-sort={active ? (sort.dir === 'desc' ? 'descending' : 'ascending') : 'none'}>
      <button onClick={() => setSort(s => ({ key: k, dir: s.key === k && s.dir === 'desc' ? 'asc' : 'desc' }))} className={`inline-flex items-center gap-1 hover:text-ink ${active ? 'text-ink' : ''}`}>
        {children}<Icon name="sort" className={`w-3 h-3 ${active ? 'text-accent' : 'text-ink-4'}`} />
      </button>{info && <Info k={info} className="ms-1" />}
    </th>
  );
}

function PriceCell({ p }) {
  if (!p.hasListing) return (
    <div className="text-[12px] text-ink-3">אין מודעה פעילה<div className="text-2xs">שווי יח׳ טיפוסית <Num>{ils(p.marketValue)}</Num></div></div>
  );
  return (
    <div className="min-w-0">
      <div className="flex items-center gap-1.5 text-[12.5px] font-semibold text-ink whitespace-nowrap">
        <Num>{ils(p.listPrice)}</Num><span className="text-ink-4">←</span><Num className="text-ink">{ils(p.postApproval)}</Num>
        <Num className={`text-2xs font-bold px-1 rounded ${p.upliftApproval > 0 ? 'text-go-ink bg-go-soft' : 'text-skip-ink bg-skip-soft'}`}>{signPct(p.upliftApproval)}</Num>
      </div>
      <div className="text-2xs text-ink-3 whitespace-nowrap"><Num>{ilsK(p.listPpsqm)}</Num>/מ״ר · <span className={p.discount > 0.05 ? 'text-go-ink font-semibold' : ''}>{p.discount >= 0 ? <><Num>{pct(p.discount)}</Num> מתחת לשוק</> : <><Num>{pct(-p.discount)}</Num> מעל השוק</>}</span></div>
    </div>
  );
}

                  </>)}

                  <RangeBar built={p.built} lo={p.built + p.rangeLo} hi={p.built + p.rangeHi} />

const SCAN_STEPS = ['איתור חלקות בגוש וחלקה', 'שליפת נסחי טאבו ובדיקת הערות סעיף 126', 'ניתוח פרוטוקולי ועדה (NLP)', 'הצלבת מודעות יד2 / מדלן', 'חישוב יתרת זכויות וציון ודאות'];

function ScanningState({ step, target }) {

    <div className="p-4">
      <div className="flex items-center gap-2 mb-3 text-[13px] font-semibold text-ink"><Icon name="radar" className="w-4 h-4 text-accent spin" />סורק את {target?.he}…</div>
      <ol className="grid gap-1.5 mb-4">
        {SCAN_STEPS.map((s, i) => (
          <li key={s} className={`flex items-center gap-2 text-[12.5px] ${i < step ? 'text-ink-2' : i === step ? 'text-ink font-semibold' : 'text-ink-4'}`}>

              <div className="text-[13px] font-semibold text-ink">אין חלקות שעונות על הסינון</div>

          ) :
          view === 'table'
            ? <OpportunityTable onOpenDev={onOpenDev} compact={compact} rows={rows} sort={sort} setSort={setSort} selectedId={selectedId} onSelect={onSelect} setHighlightId={setHighlightId} highlightId={highlightId} />
            : <OpportunityCards onOpenDev={onOpenDev} rows={rows} selectedId={selectedId} onSelect={onSelect} />}
      </div>
      <div className="px-3 py-1.5 border-t border-line text-2xs text-ink-3 flex justify-between gap-2">
        <span>מציג <Num>{scanning ? 0 : rows.length}</Num> מתוך <Num>{allRows.length}</Num> חלקות{allRows.length > rows.length && <button onClick={() => setLimit(l => l + 150)} className="ms-2 font-semibold text-accent hover:underline">הצגת עוד 150</button>}</span>
        <span className="hidden sm:inline">ציון AI = יחס זכויות לא מנוצלות · שלב תכנוני · הנחה מהשוק · דגלי טאבו</span>
      </div>
    </Card>
  );
}

/* =========================================================================
   8a. RIGHTS CALCULATOR (inspector section) + RULES LIBRARY (modal)
   ========================================================================= */
const ConfChip = ({ c }) => <span className={`inline-flex items-center text-2xs font-semibold px-1.5 rounded ring-1 ring-inset whitespace-nowrap ${CONF[c].cls}`}>{CONF[c].label}</span>;
const StrengthChip = ({ k }) => STRENGTH[k] ? <span className={`inline-flex items-center text-2xs font-semibold px-1.5 rounded whitespace-nowrap ${STRENGTH[k].cls}`}>{STRENGTH[k].label}</span> : null;
const RuleChip = ({ id, openRule }) => {
  const r = RULE_BY_ID[id]; if (!r) return null;
  const dot = { high: '#10B981', medium: '#F59E0B', low: '#DC2626' }[r.conf];
  return (
    <button onClick={() => openRule(id)} title={`${r.title} · ${CONF[r.conf].label}`}
      className="inline-flex items-center gap-1 text-2xs text-ink-2 bg-white border border-line rounded px-1.5 hover:border-accent hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/50">
      <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: dot }} />{r.short}
    </button>
  );
};
const Chips = ({ ids, openRule }) => <div className="flex flex-wrap gap-1 mt-1">{[...new Set(ids)].map(id => <RuleChip key={id} id={id} openRule={openRule} />)}</div>;

const INPUT_DEFS = [
  { k: 'lotArea', label: 'שטח מגרש', unit: 'מ״ר', src: 'טאבו · שטח רשום', type: 'num', min: 120, max: 4000 },
  { k: 'frontage', label: 'רוחב חזית', unit: 'מ׳', src: 'GIS · מדידה', type: 'num', min: 6, max: 80 },
  { k: 'floors', label: 'קומות קיימות כולל קרקע', unit: '', src: 'תיק בניין', type: 'num', min: 1, max: 12 },
  { k: 'typ', label: 'שטח קומה טיפוסית', unit: 'מ״ר', src: 'תיק בניין', type: 'num', min: 40, max: 2000 },
  { k: 'basement', label: 'שטח מרתף קיים', unit: 'מ״ר', src: 'תיק בניין', type: 'num', min: 0, max: 3000 },
  { k: 'permitYear', label: 'שנת היתר מקורי', unit: '', src: 'תיק בניין', type: 'num', min: 1900, max: 2026 },
  { k: 'pilotis', label: 'קומת עמודים פתוחה', src: 'תיק בניין · סיור', type: 'bool' },
  { k: 'roofBuilt', label: 'בנייה קיימת על הגג בהיתר', src: 'תיק בניין · לפני 27.6.2011', type: 'bool' },
  { k: 'basementUnit', label: 'המרתף הוא דירה בהיתר', src: 'תיק בניין · יחידה עצמאית', type: 'bool' },
  { k: 'main', label: 'רחוב ראשי לפי התכנית', src: 'תכנית רובע · נספח רחובות', type: 'bool' },
  { k: 'declared', label: 'בתוך אזור ההכרזה', src: 'תשריט אונסק״ו', type: 'bool' },
  { k: 'preservation', label: 'סיווג שימור', src: 'תא/2650ב', type: 'select', options: [['none', 'לא לשימור'], ['regular', 'לשימור'], ['strict', 'הגבלות מחמירות']] }
];

function InputField({ def, p, onOverride }) {
  const v = p.inputs[def.k], b = p.baseInputs[def.k];
  const edited = p.overridden.includes(def.k);
  const [txt, setTxt] = useState(String(v));
  useEffect(() => { setTxt(String(v)); }, [v, p.id]);
  const set = val => onOverride(def.k, val === b ? undefined : val);
  const commit = () => {
    const n = Number(txt);
    if (txt.trim() === '' || !isFinite(n)) { setTxt(String(v)); return; }
    const c = Math.max(def.min, Math.min(def.max, Math.round(n)));
    setTxt(String(c)); set(c);
  };
  const id = `in-${def.k}`;
  return (
    <div className={`rounded-lg border px-2 py-1.5 min-w-0 ${edited ? 'border-accent bg-accent-soft/40' : 'border-line bg-white'}`}>
      <label htmlFor={id} className="flex items-center justify-between gap-1 text-2xs text-ink-3">
        <span className="truncate inline-flex items-center gap-1">{def.label} <Info k={'in_' + def.k} /></span>{edited && <span className="text-accent font-semibold shrink-0">נערך</span>}
      </label>
      {def.type === 'num' && (
        <div className="flex items-baseline gap-1">
          <input id={id} inputMode="numeric" value={txt} onChange={e => setTxt(e.target.value)} onBlur={commit} onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); }}
            dir="ltr" className="num w-full bg-transparent text-[14px] font-bold text-ink text-start focus:outline-none" />
          {def.unit && <span className="text-2xs text-ink-3 shrink-0">{def.unit}</span>}
        </div>
      )}
      {def.type === 'bool' && (
        <button id={id} role="switch" aria-checked={!!v} onClick={() => set(!v)} className="flex items-center gap-1.5 mt-0.5">
          <span className={`w-7 h-4 rounded-full relative transition-colors ${v ? 'bg-accent' : 'bg-line'}`}><span className={`absolute top-0.5 w-3 h-3 rounded-full bg-white shadow transition-all ${v ? 'start-[14px]' : 'start-0.5'}`} /></span>
          <span className="text-[13px] font-bold text-ink">{v ? 'כן' : 'לא'}</span>
        </button>
      )}
      {def.type === 'select' && (
        <select id={id} value={v} onChange={e => set(e.target.value)} className="w-full bg-transparent text-[13px] font-bold text-ink focus:outline-none mt-0.5">
          {def.options.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
        </select>
      )}
      <div className="text-[10px] text-ink-4 truncate">{p.real && REAL_FIELDS[def.k] ? <span className="text-accent font-semibold">GIS · {REAL_FIELDS[def.k]}</span> : def.src}</div>
    </div>
  );
}

function RightsWaterfall({ calc }) {
  const t = calc.totals, c = calc.ceiling;
  const max = Math.max(t.discretion, c.area, t.existing) * 1.06;
  const segs = [
    { k: 'existing', label: 'קיים', v: t.existing, style: { background: '#475569' } },
    { k: 'vested', label: calc.pend ? 'תכנית (טרם בתוקף)' : 'זכויות מוקנות', v: t.vested - t.existing, style: { background: '#2563EB' } },
    { k: 'relief', label: 'הקלות', v: t.relief - t.vested, style: { background: 'rgba(37,99,235,.42)' } },
    { k: 'disc', label: 'שיקול דעת', v: t.discretion - t.relief, cls: 'hatch' }
  ].filter(s => s.v > 0);
  return (
    <div>
      <div className="relative pt-1.5">
        <div className="flex h-4 gap-[2px]" role="img" aria-label="מפל זכויות">
          {segs.map((s, i) => <span key={s.k} title={`${s.label}: ${n0(s.v)} מ״ר`} className={`${s.cls || ''} ${i === 0 ? 'rounded-s' : ''} ${i === segs.length - 1 ? 'rounded-e' : ''}`} style={{ width: `${s.v / max * 100}%`, ...s.style }} />)}
        </div>
        <div className="absolute top-0 bottom-[-4px] w-[2px] bg-ink" style={{ insetInlineStart: `${c.area / max * 100}%` }} />
      </div>
      <div className="flex flex-wrap gap-x-3 gap-y-1 mt-2">
        {segs.map(s => <span key={s.k} className="inline-flex items-center gap-1 text-2xs text-ink-2"><span className={`w-2.5 h-2.5 rounded-sm ${s.cls || ''}`} style={s.style} />{s.label} <Num className="font-semibold">{n0(s.v)}</Num></span>)}
        <span className="inline-flex items-center gap-1 text-2xs text-ink-2"><span className="w-[2px] h-3 bg-ink" />תקרת תא/5000 <Num className="font-semibold">{n0(c.area)}</Num></span>
      </div>
      <div className="grid grid-cols-3 gap-px bg-line rounded-lg overflow-hidden border border-line mt-2.5">
        {[['מוקנה', t.vested, calc.pend ? 'pending' : 'vested'], ['+ הקלות', t.relief, 'relief'], ['+ שיקול דעת', t.discretion, 'discretion']].map(([l, v, k]) => (
          <div key={l} className="bg-white p-2 min-w-0">
            <div className="flex items-center justify-between gap-1"><span className="text-2xs text-ink-3">{l}</span>{l === 'מוקנה' && <Info k="tiers" />}</div>
            <div className="text-[15px] font-bold text-ink leading-tight"><Num>{n0(v)}</Num> <span className="text-[10px] font-semibold text-ink-3">מ״ר</span></div>
            <div className="mt-0.5"><StrengthChip k={k} /></div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ScenarioRow({ s, best, openRule }) {
  return (
    <div className={`rounded-lg border p-2 ${best ? 'border-accent bg-accent-soft/40' : 'border-line'} ${s.available ? '' : 'opacity-70'}`}>
      <div className="flex items-start justify-between gap-2">
        <div className="min-w-0">
          <div className="flex items-center gap-1.5 flex-wrap">
            <span className="text-[12.5px] font-bold text-ink">{s.label}</span>
            {best && <span className="text-2xs font-bold text-white bg-accent rounded px-1.5">נבחר לחישוב</span>}
          </div>
          {s.available ? <div className="text-2xs text-ink-3">{s.short}</div> : <div className="text-2xs text-stop">{s.reason}</div>}
        </div>
        {s.available && (
          <div className="text-end shrink-0">
            <div className="text-[13px] font-bold text-ink"><Num>{n0(s.total)}</Num> <span className="text-[10px] text-ink-3">מ״ר</span></div>
            <div className="text-2xs text-go-ink font-semibold"><Num>+{n0(s.delta)}</Num></div>
          </div>
        )}
      </div>
      {s.available && s.parts && s.parts.length > 0 && (
        <ul className="mt-1.5 grid gap-0.5">
          {s.parts.map(pt => <li key={pt.label} className="flex justify-between text-2xs text-ink-2"><span>{pt.label}</span><Num>{n0(pt.sqm)}</Num></li>)}
        </ul>
      )}
      {s.alt && <div className="text-2xs text-act-ink mt-1">{s.alt}</div>}
      <div className="flex flex-wrap items-center gap-1 mt-1.5">{s.available && <><StrengthChip k={s.strength} /><ConfChip c={s.conf} /></>}<Chips ids={s.rules} openRule={openRule} /></div>
    </div>
  );
}

const TIER = { relief: 'relief', discretion: 'discretion', ruling: 'ruling', guideline: 'guideline', vested: 'vested' };

function RightsCalculator({ p, onOverride, onReset, openRule }) {
  const c = p.calc;
  const Step = ({ n, title, sub, children, info }) => (
    <li className="relative ps-7 pb-3.5 last:pb-0">
      <span className="absolute start-[9px] top-6 bottom-0 w-px bg-line" />
      <span className="absolute start-0 top-0 w-5 h-5 rounded-full bg-ink text-white text-[11px] font-bold grid place-items-center num">{n}</span>
      <div className="text-[12.5px] font-bold text-ink leading-5 flex items-center gap-1.5">{title}{info && <Info k={info} />}</div>
      {sub && <div className="text-2xs text-ink-3">{sub}</div>}
      <div className="mt-1.5">{children}</div>
    </li>
  );
  return (
    <Section info="calc" eyebrow="מנוע זכויות" title="חישוב זכויות בשכבות" icon="layers">
      <div className="flex items-center justify-between mb-1.5">
        <span className="eyebrow inline-flex items-center gap-1">נתוני קלט · ניתנים לעריכה <Info k="inputs" /></span>
        {p.overridden.length > 0 && <button onClick={onReset} className="text-2xs font-semibold text-accent hover:underline">איפוס ({p.overridden.length})</button>}
      </div>
      <div className="grid grid-cols-2 gap-1.5">{INPUT_DEFS.map(d => <InputField key={d.k} def={d} p={p} onOverride={onOverride} />)}</div>
      <div className="text-[10px] text-ink-3 mt-1">{p.real ? 'נתוני חלקה ומבנה מ-GIS העירוני (05/11/2026). מרתף וגג: הזנה ידנית.' : 'נתוני הדגמה.'} קיים: <Num>{n0(c.existing)}</Num> מ״ר מעל הקרקע. רובע <Num>{p.inputs.rova}</Num>.</div>

      <div className="mt-3 mb-3"><RightsWaterfall calc={c} /></div>

      <ol>
        <Step info="step1" n="1" title="תא/5000 · תקרת המתאר" sub="נבדק מול התקנון. רח״ק = שטח מעל הקרקע בלבד. בסתירה, תכנית הרובע גוברת.">
          <div className="text-[12px] text-ink-2">{c.ceiling.zone} · רח״ק מרבי <Num className="font-bold text-ink">{c.ceiling.maxFar.toFixed(1)}</Num> × <Num>{n0(p.inputs.lotArea)}</Num> מ״ר = <Num className="font-bold text-ink">{n0(c.ceiling.area)}</Num> מ״ר · גובה לפי נספח העיצוב העירוני</div>
          <Chips ids={[...c.ceiling.rules, 't5000-permit', 't5000-lot', 't5000-rova', 't5500']} openRule={openRule} />
        </Step>
        <Step info="step2" n="2" title="התכנית המפורטת · מקור הזכויות" sub={c.pend ? 'תכנית 4320 אושרה אך טרם פורסמה: תרחיש, לא זכות.' : p.inputs.rova === 'ig' ? 'תא/4562 · בתוקף מ-12.12.2023.' : 'תכנית רובע בתוקף · נקראה מהתקנון הסרוק.'}>
          <div className="grid gap-1.5">
            <ScenarioRow s={c.add} best={c.best === c.add} openRule={openRule} />
            <ScenarioRow s={c.reb} best={c.best === c.reb} openRule={openRule} />
          </div>
        </Step>
        <Step info="step3" n="3" title="הנחיות מרחביות · עיצוב, לא זכויות" sub="לפי סעיף 145ד הן לא מוסיפות ולא גורעות זכויות, אבל משפיעות על השטח שאפשר לממש.">
          {c.adjustments.length > 0 ? (
            <ul className="grid gap-1">{c.adjustments.map(a => <li key={a.label} className="flex justify-between gap-2 text-2xs text-ink-2 bg-canvas rounded px-2 py-1"><span>{a.label}</span><Num className="font-bold text-stop">{n0(a.sqm)}</Num></li>)}</ul>
          ) : <div className="text-2xs text-ink-3">אין התאמות שטח לחלקה הזו.</div>}
          <Chips ids={['g-legal', 'g-contour', 'g-balc-city', 'r3-balc', 'r3-ground', 'g-ground', ...(p.inputs.declared ? ['g-balc-decl'] : []), 'g-lines']} openRule={openRule} />
        </Step>
        <Step info="step4" n="4" title="בין השורות" sub="לא נספר במוקנה. כל ממצא מסומן לפי החוזק המשפטי שלו.">
          <div className="grid gap-1.5">
            {c.opps.map(o => (
              <div key={o.rule + o.title} className="rounded-lg border border-line p-2">
                <div className="flex items-start justify-between gap-2">
                  <span className="text-[12px] font-bold text-ink">{o.title}</span>
                  {o.sqm ? <Num className="text-[12px] font-bold text-ink shrink-0">+{n0(o.sqm)} מ״ר</Num> : null}
                </div>
                <p className="text-2xs text-ink-2 leading-snug mt-0.5">{o.text}</p>
                <div className="flex flex-wrap items-center gap-1 mt-1">{o.tier === 'risk' ? <span className="text-2xs font-semibold px-1.5 rounded bg-stop-soft text-stop">סיכון</span> : <StrengthChip k={TIER[o.tier]} />}<ConfChip c={RULE_BY_ID[o.rule].conf} /><RuleChip id={o.rule} openRule={openRule} /></div>
              </div>
            ))}
          </div>
        </Step>
        <Step info="step5" n="5" title="מסלולים חלופיים וסטטוס" sub="חלופת שקד היא תקרה סטטוטורית שדורשת תכנית, לא זכות.">
          <div className="grid gap-1.5">
            <ScenarioRow s={c.sAdd} best={false} openRule={openRule} />
            <ScenarioRow s={c.sReb} best={false} openRule={openRule} />
          </div>
          <ul className="grid gap-1 mt-2">
            {c.flags.map(f => (
              <li key={f.rule + f.text} className={`flex items-start gap-1.5 text-2xs rounded px-2 py-1 ${f.tone === 'warn' ? 'bg-act-soft text-act-ink' : 'bg-canvas text-ink-2'}`}>
                <Icon name={f.tone === 'warn' ? 'alert' : 'info'} className="w-3.5 h-3.5 shrink-0 mt-px" />
                <span className="flex-1">{f.text}</span><RuleChip id={f.rule} openRule={openRule} />
              </li>
            ))}
          </ul>
        </Step>
      </ol>
    </Section>
  );
}

function RulesModal({ focusId, onClose }) {

  useEffect(() => {
    if (focusId && focusId !== 'all') { const el = document.getElementById(`rule-${focusId}`); if (el) el.scrollIntoView({ block: 'center' }); }
  }, [focusId]);
  const list = RULES.filter(r => filter === 'all' ? true : filter === 'low' ? r.conf === 'low' : r.strength === 'pending');
  return (
    <Modal title="ספריית כללים ומקורות" onClose={onClose} wide footer={<span className="text-2xs text-ink-3 me-auto">הכללים נאספו מתקצירי חיפוש של מסמכי העירייה, פסקי דין ומאמרים מקצועיים (11/2026). התקנונים המלאים טרם נקראו. כלל שמסומן "דורש אימות" אסור להציג למשקיע כעובדה.</span>}>
      <div className="flex flex-wrap items-center gap-1.5 mb-3">
        {[['all', `הכל (${RULES.length})`], ['low', `דורש אימות (${lowCount})`], ['pending', 'טרם בתוקף']].map(([k, l]) => (
          <button key={k} onClick={() => setFilter(k)} aria-pressed={filter === k} className={`h-7 px-2.5 rounded-full text-[12px] font-semibold border ${filter === k ? 'bg-accent text-white border-accent' : 'bg-white text-ink-2 border-line'}`}>{l}</button>
        ))}
      </div>
      {[1, 2, 3, 4, 5].map(layer => {
        const rs = list.filter(r => r.layer === layer);
        if (!rs.length) return null;
        return (
          <div key={layer} className="mb-4">
            <div className="eyebrow mb-1.5">{LAYERS[layer]}</div>
            <div className="grid gap-1.5">
              {rs.map(r => (

                    <span className="text-[13px] font-bold text-ink">{r.title}</span>
                    <StrengthChip k={r.strength} /><ConfChip c={r.conf} />

                  <p className="text-[12px] text-ink-2 leading-relaxed mt-1">{r.value}</p>
                  <div className="text-2xs text-ink-3 mt-1">חל כאשר: {r.when}</div>
                  <div className="flex flex-wrap gap-x-3 gap-y-0.5 mt-1">

                </div>
              ))}
            </div>
          </div>
        );
      })}
    </Modal>
  );
}

function ScoreRing({ score, hc }) {
  const C = 2 * Math.PI * 21;
  return (
    <div className="relative w-14 h-14 shrink-0" role="img" aria-label={`ציון ודאות ${score} מתוך 100`}>
      <svg viewBox="0 0 50 50" className="w-14 h-14 -rotate-90">
        <circle cx="25" cy="25" r="21" fill="none" stroke="#EEF1F5" strokeWidth="5" />
        <circle cx="25" cy="25" r="21" fill="none" stroke={hc ? '#10B981' : score < 30 ? '#94A3B8' : '#2563EB'} strokeWidth="5" strokeLinecap="round" strokeDasharray={`${C * score / 100} ${C}`} />
      </svg>
      <div className="absolute inset-0 grid place-items-center"><span className="num text-[16px] font-bold text-ink">{score}</span></div>
    </div>
  );
}

function Modal({ title, onClose, children, footer, wide }) {
  useEffect(() => { const h = e => e.key === 'Escape' && onClose(); window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, [onClose]);
  return (
    <div className="fixed inset-0 z-[70] grid place-items-center p-4" role="dialog" aria-modal="true" aria-label={title}>
      <div className="absolute inset-0 bg-ink/40" onClick={onClose} />
      <div className={`relative bg-white rounded-2xl shadow-pop w-full ${wide ? 'max-w-[640px]' : 'max-w-[520px]'} max-h-[calc(100vh-32px)] min-h-0 flex flex-col anim-fade`}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-line">
          <div className="text-[14px] font-bold text-ink">{title}</div>
          <button onClick={onClose} className="p-1 rounded-md text-ink-3 hover:text-ink hover:bg-canvas" aria-label="סגירה"><Icon name="x" className="w-4 h-4" /></button>
        </div>
        <div className="flex-1 min-h-0 overflow-y-auto scroll-thin p-4">{children}</div>
        {footer && <div className="px-4 py-3 border-t border-line flex flex-wrap items-center justify-end gap-2">{footer}</div>}
      </div>
    </div>
  );
}

async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) { if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); } return false; }
}

const LS_KEY = 'israprop.pipeline.v1';
const loadPipeline = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; } };
const savePipeline = v => { try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch (e) { } };
const useMedia = q => { const [m, setM] = useState(() => window.matchMedia(q).matches); useEffect(() => { const mq = window.matchMedia(q); const h = () => setM(mq.matches); mq.addEventListener('change', h); return () => mq.removeEventListener('change', h); }, [q]); return m; };

function App() {
  const [dev, saveDev] = useDevParams();
  const [lst, writeListing] = useListings();
  const [devOpen, setDevOpen] = useState(false);
  const [aboutOpen, setAboutOpen] = useState(() => { try { return !localStorage.getItem('israprop.about.seen'); } catch (e) { return true; } });
  const closeAbout = () => { setAboutOpen(false); try { localStorage.setItem('israprop.about.seen', '1'); } catch (e) {} };
  const initialTarget = SEARCH_INDEX.find(t => t.id === 'אחד העם') || SEARCH_INDEX.find(t => t.type === 'street');
  const [query, setQuery] = useState('אחד העם');
  const [target, setTarget] = useState(initialTarget);
  const [scan, setScan] = useState(() => scanList(initialTarget));
  const [overrides, setOverrides] = useState({});
  const [extra, setExtra] = useState(null);
  const [rulesFocus, setRulesFocus] = useState(null);
  const parcels = useMemo(() => scan.map(s => genParcelC(s.streetId, s.num, s.idx, s.total, overrides[`${s.streetId}-${s.num}`])), [scan, overrides, lst.v]);
  const [scanning, setScanning] = useState(false);
  const [scanStep, setScanStep] = useState(0);
  const [chips, setChips] = useState([]);
  const [tab, setTab] = useState('all');
  const [sort, setSort] = useState({ key: 'score', dir: 'desc' });
  const isXL = useMedia('(min-width: 1280px)');
  const isNarrow = useMedia('(max-width: 767px)');
  const [view, setView] = useState(isNarrow ? 'cards' : 'table');
  const [selectedId, setSelectedId] = useState(() => isXL ? [...parcels].sort((a, b) => b.score - a.score)[0].id : null);
  const [highlightId, setHighlightId] = useState(null);
  const [pipeline, setPipeline] = useState(() => loadPipeline().filter(x => realRec(x.streetId, x.num)));
  const [modal, setModal] = useState(null);
  const [toasts, setToasts] = useState([]);
  const timer = useRef(null);

  useEffect(() => { savePipeline(pipeline); }, [pipeline]);
  useEffect(() => { setView(isNarrow ? 'cards' : 'table'); }, [isNarrow]);
  useEffect(() => {
    const h = e => { if (e.key === 'Escape' && !modal && rulesFocus === null) setSelectedId(null); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, [modal, rulesFocus]);

  const toast = useCallback(msg => {
    const id = Math.random();
    setToasts(t => [...t, { id, msg }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  }, []);

  const onScan = t => {
    if (!t) { toast('לא נמצא רחוב תואם. בחרו מהרשימה.'); return; }
    clearInterval(timer.current);
    setTarget(t); setQuery(t.he); setScanning(true); setScanStep(0); setSelectedId(null); setTab('all');
    let i = 0;
    timer.current = setInterval(() => {
      i += 1;
      if (i >= SCAN_STEPS.length) {
        clearInterval(timer.current);
        const res = scanList(t).map(s => genParcelC(s.streetId, s.num, s.idx, s.total, overrides[`${s.streetId}-${s.num}`]));
        setScan(scanList(t)); setScanning(false);
        const hc = res.filter(p => p.highConviction).length;
        toast(`הסריקה הושלמה: ${res.length} חלקות, ${hc} הזדמנויות בוודאות גבוהה`);
      } else setScanStep(i);
    }, 420);
  };

  const toggleChip = id => setChips(c => c.includes(id) ? c.filter(x => x !== id) : [...c, id]);

  const chipFiltered = useMemo(() => parcels.filter(p => chips.every(id => QUICK_FILTERS.find(f => f.id === id).test(p))), [parcels, chips]);
  const rows = useMemo(() => {
    chipFiltered.forEach(p => { p.econ = econ(p, dev.values); });
    const t = TABS.find(x => x.id === tab);
    const get = SORTS[sort.key].get;
    return chipFiltered.filter(t.test).sort((a, b) => {
      const va = get(a), vb = get(b);
      const c = typeof va === 'string' ? va.localeCompare(vb, 'he') : va - vb;
      return sort.dir === 'desc' ? -c : c;
    });
  }, [chipFiltered, tab, sort, dev.values]);
  const visibleIds = useMemo(() => new Set(rows.map(r => r.id)), [rows]);

  const parcelsById = useMemo(() => Object.fromEntries(parcels.map(p => [p.id, p])), [parcels]);
  const extraParcel = useMemo(() => extra ? genParcelC(extra.streetId, extra.num, extra.idx, extra.total, overrides[`${extra.streetId}-${extra.num}`]) : null, [extra, overrides, lst.v]);
  const selected = selectedId ? (parcelsById[selectedId] || (extraParcel && extraParcel.id === selectedId ? extraParcel : null)) : null;
  if (selected && !selected.econ) selected.econ = econ(selected, dev.values);
  const selectP = p => setSelectedId(p.id);
  const onOverride = (k, v) => {
    const id = selected.id;
    setOverrides(o => { const cur = { ...(o[id] || {}) }; if (v === undefined) delete cur[k]; else cur[k] = v; const n = { ...o }; if (Object.keys(cur).length) n[id] = cur; else delete n[id]; return n; });
  };
  const onResetOverrides = () => { const id = selected.id; setOverrides(o => { const n = { ...o }; delete n[id]; return n; }); };
  const isSaved = selected && pipeline.some(x => x.id === selected.id);
  const onSave = () => {
    if (!selected) return;
    if (isSaved) { setPipeline(pl => pl.filter(x => x.id !== selected.id)); toast('הוסר מהצנרת'); }
    else { const { id, address, gush, chelka, score, status, streetId, num } = selected; setPipeline(pl => [{ id, address, gush, chelka, score, status, streetId, num }, ...pl]); toast('נשמר לצנרת ההשקעות'); }
  };
  const openFromPipeline = item => {
    if (parcelsById[item.id]) { setSelectedId(item.id); return; }
    setExtra({ streetId: item.streetId, num: item.num, idx: 0, total: 1 }); setSelectedId(item.id);
  };

  const inspector = selected && (
    <Inspector onOpenDev={() => setDevOpen(true)} p={selected} overlay={!isXL} saved={isSaved} onClose={() => setSelectedId(null)}
      onOverride={onOverride} onReset={onResetOverrides} openRule={id => setRulesFocus(id)}
      onExport={() => setModal('teaser')} onSave={onSave} onContact={() => setModal('contact')} />
  );

  return (
    <ListingCtx.Provider value={{ st: lst, write: writeListing }}>
    <div className="app flex flex-col">
      <Header onOpenAbout={() => setAboutOpen(true)} onOpenDev={() => setDevOpen(true)} devMissing={dev.src !== 'loading' && !dev.values} onOpenRules={() => setRulesFocus('all')} query={query} setQuery={setQuery} onScan={onScan} scanning={scanning} scanStep={scanStep} scanTarget={target}
        chips={chips} toggleChip={toggleChip} pipeline={pipeline} onOpenParcel={openFromPipeline} parcelsById={parcelsById}
        onRemovePipeline={id => setPipeline(pl => pl.filter(x => x.id !== id))} />

      <main className={`shell flex-1 min-h-0 py-3 grid gap-3 grid-cols-1 lg:grid-cols-[320px_minmax(0,1fr)] ${selected && isXL ? 'xl:grid-cols-[300px_minmax(0,1fr)_410px] 2xl:grid-cols-[340px_minmax(0,1fr)_470px]' : 'xl:grid-cols-[300px_minmax(0,1fr)] 2xl:grid-cols-[340px_minmax(0,1fr)]'}`}>
        <aside className="min-w-0 grid gap-3 content-start xl:min-h-0 xl:overflow-y-auto scroll-thin" aria-label="סקירה מרחבית וקדסטרלית">
          <MapSwitch parcels={parcels.length > 400 ? rows.slice(0, 200) : parcels} visibleIds={chips.length || tab !== 'all' ? visibleIds : null} selectedId={selected?.id}
            onSelect={selectP} highlightId={highlightId} setHighlightId={setHighlightId} />
          <DensityMetrics parcels={parcels} target={target} />
          <p className="text-2xs text-ink-3 leading-snug px-1">חלקות, מבנים, שימור, אזור ההכרזה, היתרים ותכניות: שרת ה-GIS של עיריית ת״א, נשלף 05/11/2026. פרוטוקולים וסדרי יום של הוועדה (2025–2026): סריקה אוטומטית. נסחי טאבו ומחירי מודעות: הדגמה.</p>
        </aside>

        <section className="min-w-0 xl:min-h-0" aria-label="פיד הזדמנויות">
          <FeedColumn onOpenDev={() => setDevOpen(true)} compact={!!(selected && isXL)} parcels={chipFiltered} rows={rows} tab={tab} setTab={setTab} sort={sort} setSort={setSort} view={view} setView={setView}
            selectedId={selected?.id} onSelect={selectP} scanning={scanning} scanStep={scanStep} target={target}
            setHighlightId={setHighlightId} highlightId={highlightId} chipsActive={chips.length > 0} />
        </section>

        {isXL && selected && <aside key={selected.id} className="min-w-0 min-h-0" aria-label="בוחן נכס">{inspector}</aside>}
      </main>

      {!isXL && selected && (
        <div className="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-label="בוחן נכס">
          <div className="absolute inset-0 bg-ink/30" onClick={() => setSelectedId(null)} />
          <div key={selected.id} className="absolute inset-y-0 end-0 w-full sm:w-[460px] shadow-pop" style={{ paddingTop: 'env(safe-area-inset-top, 0px)', paddingBottom: 'env(safe-area-inset-bottom, 0px)', paddingLeft: 'env(safe-area-inset-left, 0px)', background: '#fff' }}>
            {inspector}
          </div>
        </div>
      )}

      {aboutOpen && <AboutModal onClose={closeAbout} onOpenDev={() => setDevOpen(true)} />}
      {devOpen && <DevParamsModal dev={dev} onSave={saveDev} onClose={() => setDevOpen(false)} toast={toast} />}
      {rulesFocus !== null && <RulesModal focusId={rulesFocus} onClose={() => setRulesFocus(null)} />}
      {modal === 'teaser' && selected && <TeaserModal p={selected} onClose={() => setModal(null)} toast={toast} />}
      {modal === 'contact' && selected && <ContactModal p={selected} onClose={() => setModal(null)} toast={toast} />}

      <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[80] grid gap-2 justify-items-center pointer-events-none" style={{ marginBottom: 'env(safe-area-inset-bottom, 0px)' }} aria-live="polite">
        {toasts.map(t => <div key={t.id} className="anim-fade bg-ink text-white text-[12.5px] font-semibold px-3.5 py-2 rounded-lg shadow-pop flex items-center gap-2"><Icon name="check" className="w-4 h-4 text-go" stroke={2.4} />{t.msg}</div>)}
      </div>
    </div>
    </ListingCtx.Provider>
  );
}

document.documentElement.setAttribute('dir', 'rtl');
document.documentElement.setAttribute('lang', 'he');
function Root() {
  const [state, setState] = useState('loading');
  useEffect(() => { loadData().then(() => setState('ready')).catch(e => setState('error:' + e.message)); }, []);
  if (state === 'ready') return <App />;
  return (
    <div className="h-full grid place-items-center p-6 text-center">
      <div>
        <Icon name="radar" className={`w-8 h-8 mx-auto text-accent ${state === 'loading' ? 'spin' : ''}`} />
        <div className="mt-2 text-[14px] font-bold text-ink">{state === 'loading' ? 'טוען נתוני חלקות מה-GIS העירוני…' : 'טעינת הנתונים נכשלה'}</div>
        {state !== 'loading' && <div className="text-2xs text-ink-3 mt-1">{state.slice(6)}. רעננו את העמוד.</div>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>

</body>
</html>
